plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // implementation 'org.ini4j:ini4j:0.5.4'
    implementation 'org.apache.commons:commons-configuration2:2.9.0'
}
 configurations {
    all{
        //exclude group: 'commons-logging', module: 'commons-logging'
        //exclude group: 'org.apache.httpcomponents'
        exclude module: 'httpclient'
    }
}

android {
    lint {
        disable 'DuplicatePlatformClasses'
    }

    compileSdk 36
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "org.purplei2p.i2pd"
        targetSdk 36
        minSdk 23
        versionCode 3000000
        versionName "3.0.0"

        ndk {
            abiFilters "armeabi-v7a"
            abiFilters "x86"
            abiFilters "arm64-v8a"
            abiFilters "x86_64"
        }

        externalNativeBuild {
            ndkBuild {
                arguments "NDK_MODULE_PATH:=${rootProject.projectDir}/binary/jni"
                arguments "-j${Runtime.getRuntime().availableProcessors()}"
            }
        }
    }

    splits {
        abi {
            // change that to true if you need splitted apk
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }

    signingConfigs {
        release {
            storeFile file("i2pdapk.jks")
            storePassword "android"
            keyAlias "i2pdapk"
            keyPassword "android"
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
        debug {
            jniDebuggable = true
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "${rootProject.projectDir}/app/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    namespace 'org.purplei2p.i2pd'
}

base { archivesName = "i2pd-${android.defaultConfig.versionName}" }

def abiCodes = ['armeabi-v7a': 1, 'x86': 2, 'arm64-v8a': 3, 'x86_64': 4]

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType.name() == 'ABI' }?.identifier
            def baseAbiVersionCode = abiCodes.get(abi)

            if (baseAbiVersionCode != null) {
                output.versionCode.set(baseAbiVersionCode + output.versionCode.getOrElse(0))
            }
        }
    }
}
