name: Android CI

on: [push, pull_request]

env:
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive'
    - name: Install GNU C++ compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y g++
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v5
    - name: Install required Android SDK packages
      run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION"
    - name: Build required modules
      run: |
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION
        export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
        pushd binary/jni
        ./build.sh
        popd
    - name: Build with Gradle
      run: ./gradlew --no-daemon assembleDebug
    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: android-apks
        path: app/build/outputs/apk/debug/*.apk

  build-binary:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive'
    - name: Install required Android SDK packages
      run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION"
    - name: Build binary with NDK
      run: |
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION
        export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
        pushd binary/jni
        ./build.sh -b
        popd
    - name: Create package with built binaries
      run: |
        pushd contrib/binary_pack
        ./build-archive
        popd
    - name: Upload binaries archive
      uses: actions/upload-artifact@v5
      with:
        name: android-binaries
        path: binary/libs/*
    - name: Upload binaries package
      uses: actions/upload-artifact@v5
      with:
        name: android-binaries-pack
        path: contrib/binary_pack/i2pd_*_android_binary.zip
